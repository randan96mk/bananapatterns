# Banana Patterns with Docker (Mac now, a cloud server later): ./docker.sh up
# Your existing data/, logs/ and config/ folders are mounted in, so the same database, settings and Kite
# token are used as with ./start.sh. Run one copy at a time: two copies would send every alert twice.
services:
  banana:
    build: .
    image: bananapatterns:latest
    container_name: bananapatterns
    restart: unless-stopped
    user: "${BP_UID:-1000}:${BP_GID:-1000}"   # your user (docker.sh sets it), so it can write data/ and logs/
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      OLLAMA_URL: http://ollama:11434          # 🤖 the local AI service below (compose network only)
    ports:
      - "127.0.0.1:${BP_PORT:-8000}:8000"     # this computer only; Kite redirect stays localhost:8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config                   # the NSE holiday list refreshes here
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 🤖 Local AI (Ollama): reachable only from the app on the compose network, nothing published. Models live in
  # ./data/ai (they survive rebuilds) and are downloaded from the System › AI page. Low CPU priority next to the app.
  ollama:
    image: ollama/ollama:0.40.16
    container_name: bananapatterns-ai
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_THREAD: "3"
    volumes:
      - ./data/ai:/root/.ollama
    cpus: "2.5"
    mem_limit: 12g
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
